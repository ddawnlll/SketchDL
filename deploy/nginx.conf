# SketchDL — Nginx reverse proxy (TLS termination + request limits).
# The app binds 127.0.0.1:8087 and streams files itself (sendfile, Range).
# Replace the server_name, cert paths, and upstream as needed.

upstream sketchdl_app {
    server 127.0.0.1:8087;
}

server {
    listen 80;
    server_name downloads.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name downloads.example.com;

    ssl_certificate     /etc/letsencrypt/live/downloads.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/downloads.example.com/privkey.pem;

    client_max_body_size 16k;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 65s;
    keepalive_timeout 65s;
    # The app uses sendfile for file bodies. Keep nginx's fast proxy path,
    # but bound per-request temp buffering: files can be up to 2 GiB and the
    # default 1 GiB temp cap per request would multiply across downloads.
    # Benchmarked loopback (128 MiB): buffering on 285 MB/s / 5 ms TTFB,
    # buffering off 120 MB/s / 21 ms TTFB, so buffering stays on.
    proxy_max_temp_file_size 64m;

    # Compressed policies for pages; file downloads stay uncompressed.
    gzip on;
    gzip_types text/css text/html;
    gzip_min_length 1024;

    location / {
        proxy_pass http://sketchdl_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Only; the app rate-limits logins itself.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Downloads are long-lived; don't sever them at the default 60s.
        proxy_read_timeout 30m;
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        # Never cache authenticated HTML or downloads.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "private, no-store" always;
    }

    access_log /var/log/nginx/sketchdl.access.log;
    error_log /var/log/nginx/sketchdl.error.log;
}
