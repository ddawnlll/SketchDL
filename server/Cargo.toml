[package]
name = "sketchdl"
version = "0.2.0"
edition = "2024"
description = "Fast zero-WASM YouTube MP4 downloader: Axum server, server-rendered HTML, SSE progress"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
argon2 = "0.5"
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
url = "2"
percent-encoding = "2"
http = "1"
bytes = "1"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
